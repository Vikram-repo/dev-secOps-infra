variables:
  - group: todo-project
# pr:
#  branches:
#    include:
#      - main
trigger: none
pool: test-pool
jobs:
 - job: tflint
   displayName: terraform tf lint
   steps:
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          cd $(System.DefaultWorkingDirectory)/terraform
          tflint --init
          tflint --recursive
 - job: terraforminit 
   displayName: terraform init
   steps:
     - task: TerraformTask@5
       inputs:
         provider: 'azurerm'
         command: 'init'
         workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
         backendServiceArm: '$(svc)'
         backendAzureRmStorageAccountName: '$(backend_space)'
         backendAzureRmContainerName: '$(backend_cont)'
         backendAzureRmKey: 'prod.terraform.tfstate'
  
     - task: PublishPipelineArtifact@1
       inputs:
         targetPath: '$(System.DefaultWorkingDirectory)/terraform'
         artifact: 'tf-config'
         publishLocation: 'pipeline'
 - job: tfsec
   displayName: tfsec scan
   dependsOn: terraforminit
   steps:
    - task: DownloadPipelineArtifact@2
      inputs:
         buildType: 'current'
         artifactName: 'tf-config'
         targetPath: '$(Pipeline.Workspace)'
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          cd $(Pipeline.Workspace)
          tfsec --format json --out tfsec-result.json
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)/tfsec-result.json'
        artifact: 'tfsec-report'
        publishLocation: 'pipeline'
 - job: terraformplan
   dependsOn: tfsec
   displayName: 
   steps:
     - task: DownloadPipelineArtifact@2
       inputs:
         buildType: 'current'
         artifactName: 'tf-config'
         targetPath: '$(Pipeline.Workspace)'

     - task: Bash@3
       inputs:
         targetType: 'inline'
         script: |
           cd $(Pipeline.Workspace)
           chmod -R a+rx .terraform/providers

     - task: TerraformTask@5
       inputs:
         provider: 'azurerm'
         workingDirectory: '$(Pipeline.Workspace)'
         command: 'plan'
         environmentServiceNameAzureRM: '$(svc)'
  