trigger: none
pool: test-pool
jobs:
 - job: tflint
   displayName: terraform tf lint
   steps:
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          cd $(System.DefaultWorkingDirectory)/terraform
          tflint --init
          tflint --recursive

 - job: terraforminit 
   displayName: terraform init
   steps:
     - task: TerraformTask@5
       inputs:
         provider: 'azurerm'
         command: 'init'
         workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
         backendServiceArm: 'todo-sec-svc'
         backendAzureRmStorageAccountName: 'sandisk11'
         backendAzureRmContainerName: 'friday11'
         backendAzureRmKey: 'prod.terraform.tfstate'